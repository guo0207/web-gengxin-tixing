name: Website Monitor

on:
  schedule:
    # 这里使用的是 Cron 语法，当前设置为每 2 小时运行一次
    # 如果想每小时运行，改为 '0 * * * *'
    # 注意：GitHub Actions 的定时任务使用的是 UTC 时间
    - cron: '17 * * * *'
    # - cron: '0 */1 * * *'
  workflow_dispatch: # 允许你手动点击按钮运行，方便测试

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    
    # 赋予 GITHUB_TOKEN 写入仓库的权限，这样才能保存 last_data.txt
    permissions:
      contents: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor script
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python monitor.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add last_data.txt
          # 检查是否有文件改动，如果有就提交并推送到仓库
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update last_data.txt" && git push)
